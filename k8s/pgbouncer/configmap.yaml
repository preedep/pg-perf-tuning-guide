apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: corebank
data:
  pgbouncer.ini: |
    [databases]
    corebank = host=postgres.corebank.svc.cluster.local port=5432 dbname=corebank
    
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = postgres
    
    # Transaction pooling mode - connections returned to pool after each transaction
    pool_mode = transaction
    
    # Client connection limits
    max_client_conn = 100
    max_user_connections = 100
    
    # Pool size settings (Baseline: PostgreSQL max_connections=5)
    # Keep max_db_connections < PostgreSQL max_connections to leave room for admin
    # With only 5 DB connections, PgBouncer will queue clients
    max_db_connections = 4
    default_pool_size = 2
    min_pool_size = 1
    reserve_pool_size = 1
    reserve_pool_timeout = 3
    
    # Connection timeouts
    server_lifetime = 3600
    server_idle_timeout = 300
    server_connect_timeout = 15
    server_login_retry = 15
    
    # Query timeouts (0 = disabled for transaction mode)
    query_timeout = 0
    query_wait_timeout = 120
    
    # Client timeouts
    client_idle_timeout = 0
    client_login_timeout = 60
    
    # DNS and maintenance
    autodb_idle_timeout = 3600
    dns_max_ttl = 15
    dns_nxdomain_ttl = 15
    
    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    stats_period = 60
    
    # Compatibility
    ignore_startup_parameters = extra_float_digits
    
  userlist.txt: |
    "postgres" "postgres"
