apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config-default
  namespace: corebank
data:
  POSTGRES_DB: corebank
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  # PostgreSQL 16 actual default configuration - no tuning
  postgresql.conf: |
    # Connection Settings
    listen_addresses = '*'
    max_connections = 20
    
    # Memory Settings (PostgreSQL defaults)
    shared_buffers = 128MB
    effective_cache_size = 4GB
    maintenance_work_mem = 64MB
    work_mem = 4MB
    
    # WAL Settings (PostgreSQL defaults)
    wal_buffers = -1
    min_wal_size = 80MB
    max_wal_size = 1GB
    checkpoint_completion_target = 0.9
    
    # Query Planner (PostgreSQL defaults)
    default_statistics_target = 100
    random_page_cost = 4.0
    effective_io_concurrency = 1
    
    # Write Performance (PostgreSQL defaults)
    synchronous_commit = on
    
    # Logging
    log_min_duration_statement = -1
    log_checkpoints = off
    log_connections = off
    log_disconnections = off
    log_lock_waits = off
