[package]
name = "pg-perf-tuning-guide"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "rust_decimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
rust_decimal = { version = "1.33", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
mockall = "0.12"

[[bin]]
name = "seed-data"
path = "scripts/seed-data.rs"

[[bin]]
name = "load-tester"
path = "scripts/load-tester.rs"
